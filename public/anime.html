<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Hub — UniVault 4K</title>
  <meta name="description" content="Stream the best anime series and movies in 4K Ultra HD sub and dub on UniVault.">
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/netflix-theme.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

  <!-- Global Navbar -->
  <header class="navbar" id="globalNavbar" role="banner"></header>

  <main class="app-container" role="main">

    <!-- Anime Cinematic Hero Banner -->
    <section class="netflix-hero" id="animeHero" aria-label="Featured Anime">
      <div class="skeleton-shimmer skeleton-hero"></div>
    </section>

    <!-- Main Anime Catalog & Explore Section -->
    <div class="content-wrapper">
      <div class="section-container" style="padding-top: 1rem;">
        
        <!-- Filter Pills & Sorting -->
        <div class="filter-bar">
          <div class="filter-pills" role="tablist" aria-label="Anime genre filters">
            <button type="button" class="filter-pill active" data-category="popular">All Popular</button>
            <button type="button" class="filter-pill" data-category="action">Action &amp; Shonen</button>
            <button type="button" class="filter-pill" data-category="fantasy">Fantasy &amp; Isekai</button>
            <button type="button" class="filter-pill" data-category="comedy">Comedy &amp; Slice of Life</button>
            <button type="button" class="filter-pill" data-category="romance">Romance &amp; Drama</button>
            <button type="button" class="filter-pill" data-category="top_rated">Top Rated</button>
          </div>

          <div class="sort-select-wrapper">
            <label for="animeSortSelect">Sort by:</label>
            <select id="animeSortSelect" class="sort-select" aria-label="Sort anime">
              <option value="popularity.desc">Most Popular</option>
              <option value="vote_average.desc">Top Rated</option>
            </select>
          </div>
        </div>

        <!-- Anime Grid -->
        <div class="netflix-grid" id="animeGrid">
          <!-- Anime dynamically injected -->
        </div>

        <!-- Responsive Anime Pagination -->
        <div class="pagination-container" id="animePagination">
          <!-- Pagination dynamically injected -->
        </div>

      </div>

      <!-- Curated Anime Carousels -->
      <section id="carouselAnimeTrending" aria-label="Trending Anime"></section>
      <section id="carouselAnimeAction" aria-label="Action Anime"></section>
      <section id="carouselAnimeFantasy" aria-label="Fantasy Anime"></section>
      <section id="carouselAnimeTopRated" aria-label="Top Rated Anime"></section>
    </div>

  </main>

  <!-- Global Footer -->
  <footer class="netflix-footer" id="globalFooter" role="contentinfo"></footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/tmdb-api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
