<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — UniVault 4K</title>
  <meta name="description" content="Sign in to your UniVault account to access 4K Ultra HD movies, series, and anime.">
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page-wrapper">

    <!-- Backdrop Layer -->
    <div class="auth-backdrop" aria-hidden="true">
      <div class="auth-poster-grid">
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/b33nnKl1vBbi4bITVjhne3Nz0h.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/oBIQDKcqNxKckjug0749V2c1zbt.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/kDp1vUBnMpe8ak4rjgl3cLELqjU.jpg');"></div>
      </div>
      <div class="auth-overlay-gradient"></div>
    </div>

    <header class="auth-header" role="banner">
      <a href="landing.html" class="auth-brand" aria-label="UniVault Home">
        <img src="images/logo.png" alt="UniVault" class="auth-logo-img">
        <span class="auth-logo-text">UNIVAULT</span>
      </a>
    </header>

    <!-- Main Form Section -->
    <main class="auth-main" role="main">
      <div class="auth-card auth-card-standalone">
        <h1 class="auth-card-title">Sign In</h1>
        <p class="auth-card-subtitle">Enter your details to access your account</p>

        <div class="auth-error-banner" id="loginErrorBox" role="alert"></div>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="auth-field-group">
            <input 
              type="email" 
              class="auth-input-card" 
              id="loginEmail" 
              placeholder=" " 
              autocomplete="email" 
              required
            >
            <label for="loginEmail" class="auth-label-card">Email address</label>
          </div>

          <div class="auth-field-group">
            <input 
              type="password" 
              class="auth-input-card" 
              id="loginPass" 
              placeholder=" " 
              autocomplete="current-password" 
              required
            >
            <label for="loginPass" class="auth-label-card">Password</label>
            <button type="button" class="auth-toggle-pass-btn" id="toggleLoginPass" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>

          <button type="submit" class="auth-btn-submit" id="loginSubmitBtn">
            Sign In
          </button>

          <div class="auth-divider"><span>OR</span></div>

          <button type="button" class="auth-btn-google" id="googleLoginBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
          </button>
        </form>

        <div class="auth-card-footer">
          <span class="auth-card-footer-text">New to UniVault?</span>
          <a href="signup.html" class="auth-card-switch-link">Sign up now.</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="auth-footer" role="contentinfo">
      <div class="auth-footer-inner">
        <p class="auth-footer-contact">Questions? Call <a href="tel:0008009191694">000-800-919-1694</a></p>
        
        <ul class="auth-footer-links">
          <li><a href="#">FAQ</a></li>
          <li><a href="#">Help Centre</a></li>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Privacy</a></li>
          <li><a href="#">Cookie Preferences</a></li>
        </ul>

        <p class="auth-footer-copyright">UniVault India • 4K Ultra HD Streaming Hub</p>
      </div>
    </footer>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
