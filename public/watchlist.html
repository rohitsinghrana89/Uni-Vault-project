<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My List — UniVault 4K</title>
  <meta name="description" content="Your personal saved vault of movies, shows, and anime on UniVault.">
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/netflix-theme.css">
  <link rel="stylesheet" href="css/navbar.css">
  <style>
    .watchlist-filter-tabs {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }
    .watchlist-filter-tab {
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .watchlist-filter-tab:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .watchlist-filter-tab.active {
      background: var(--accent-gradient);
      border-color: var(--accent-red);
      color: #fff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- Global Navbar -->
  <header class="navbar" id="globalNavbar" role="banner"></header>

  <main class="app-container" style="padding-top: 6.5rem;" role="main">
    <div class="section-container">
      
      <!-- Page Header -->
      <div style="margin-bottom: 1.5rem;">
        <h1 style="font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; letter-spacing: -0.03em; color: #fff; margin-bottom: 0.4rem;">
          My List
        </h1>
        <p style="color: #9CA3AF; font-size: 1rem;">
          All your saved movies, series, and anime titles in one personal collection.
        </p>
      </div>

      <!-- Filter Tabs -->
      <div class="watchlist-filter-tabs" role="tablist" aria-label="Watchlist category filter">
        <button type="button" class="watchlist-filter-tab active" data-filter="all">All Titles</button>
        <button type="button" class="watchlist-filter-tab" data-filter="movie">Movies</button>
        <button type="button" class="watchlist-filter-tab" data-filter="tv">TV Shows</button>
      </div>

      <!-- Empty State -->
      <div id="watchlistEmptyState" style="display: none; text-align: center; padding: 5rem 1rem;">
        <div style="font-size: 3.5rem; margin-bottom: 1.25rem;">🎬</div>
        <h3 style="font-size: 1.5rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem;">Your list is empty</h3>
        <p style="color: #9CA3AF; font-size: 1rem; max-width: 420px; margin: 0 auto 1.5rem;">
          Save movies and shows you want to watch later by clicking the "+" button on any title.
        </p>
        <a href="index.html" class="btn-netflix btn-netflix-red">Browse Trending Titles</a>
      </div>

      <!-- Watchlist Grid -->
      <div class="netflix-grid" id="watchlistGrid">
        <!-- Injected dynamically -->
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="netflix-footer" id="globalFooter" role="contentinfo"></footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/tmdb-api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
