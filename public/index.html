<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniVault — Watch Movies, Shows & Anime in 4K</title>
  <meta name="description" content="Stream unlimited movies, television series, and anime in 4K Ultra HD on UniVault.">
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/netflix-theme.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

  <!-- Global Netflix-Style Navigation Bar -->
  <header class="navbar" id="globalNavbar" role="banner"></header>

  <!-- Main Platform Content -->
  <main class="app-container" role="main">

    <!-- Cinematic Hero Section -->
    <section class="netflix-hero" id="netflixHero" aria-label="Featured Title">
      <div class="skeleton-shimmer skeleton-hero"></div>
    </section>

    <!-- 3-Bar Category Navigation Bar -->
    <div class="section-container" style="padding-top: 1rem; padding-bottom: 0;">
      <div id="category3BarNav"></div>
    </div>

    <!-- Horizontal Streaming Rows -->
    <div class="content-wrapper">
      <section id="carouselContinueWatching" aria-label="Continue Watching" style="display: none;"></section>
      <section id="carouselTrending" aria-label="Trending Now (Top 10)"></section>
      <section id="carouselPopularMovies" aria-label="Popular Movies"></section>
      <section id="carouselPopularTV" aria-label="Popular TV Shows"></section>
      <section id="carouselAnime" aria-label="Anime Spotlight"></section>
      <section id="carouselTopRated" aria-label="Top Rated"></section>
      <section id="carouselNewReleases" aria-label="New Releases"></section>
      <section id="carouselAction" aria-label="Action Movies"></section>
      <section id="carouselComedy" aria-label="Comedy Movies"></section>
      <section id="carouselHorror" aria-label="Horror Movies"></section>
      <section id="carouselSciFi" aria-label="Sci-Fi Movies"></section>
    </div>

  </main>

  <!-- Global Streaming Footer -->
  <footer class="netflix-footer" id="globalFooter" role="contentinfo"></footer>

  <!-- Scripts Architecture -->
  <script src="js/auth.js"></script>
  <script src="js/tmdb-api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
