<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Title Details — UniVault 4K</title>
  <meta name="description" content="View synopsis, cast, trailers, episodes, and similar titles in 4K on UniVault.">
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/netflix-theme.css">
  <link rel="stylesheet" href="css/navbar.css">
  <style>
    .details-hero {
      position: relative;
      min-height: clamp(520px, 75vh, 780px);
      display: flex;
      align-items: flex-end;
      padding: clamp(2rem, 5vw, 4rem);
      padding-bottom: 3.5rem;
      background: var(--bg-canvas);
    }
  </style>
</head>
<body>

  <!-- Global Navbar -->
  <header class="navbar" id="globalNavbar" role="banner"></header>

  <main class="app-container" role="main">

    <!-- Details Main Hero & Synopsis -->
    <section class="details-hero" id="detailsHero" aria-label="Media Details">
      <div class="skeleton-shimmer skeleton-hero"></div>
    </section>

    <div class="content-wrapper">

      <!-- Top Billed Cast Section -->
      <section class="section-container" id="detailsCastSection">
        <div class="section-header">
          <h2 class="section-title">Top Billed Cast</h2>
        </div>
        <div class="netflix-carousel-wrapper">
          <div class="netflix-carousel-track" id="detailsCastTrack" style="gap: 1.25rem; padding-bottom: 1rem;">
            <!-- Cast populated dynamically -->
          </div>
        </div>
      </section>

      <!-- TV Seasons & Episodes Section (TV Only) -->
      <section class="section-container" id="tvEpisodesSection" style="display: none;"></section>

      <!-- Similar Titles Carousel -->
      <section id="carouselSimilar" aria-label="Similar Titles"></section>

      <!-- Recommendations Carousel -->
      <section id="carouselRecommendations" aria-label="More Like This"></section>

    </div>

  </main>

  <!-- Global Footer -->
  <footer class="netflix-footer" id="globalFooter" role="contentinfo"></footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/tmdb-api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
