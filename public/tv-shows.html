<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Shows — UniVault 4K</title>
  <meta name="description" content="Stream top-rated TV series, limited series, and seasonal shows in 4K Ultra HD on UniVault.">
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/netflix-theme.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

  <!-- Global Navbar -->
  <header class="navbar" id="globalNavbar" role="banner"></header>

  <main class="app-container" style="padding-top: 6.5rem;" role="main">
    <div class="section-container">
      
      <!-- 3-Bar Category Navigation Bar -->
      <div id="category3BarNav"></div>

      <!-- Page Title & Overview -->
      <div style="margin-bottom: 1.5rem;">
        <h1 style="font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; letter-spacing: -0.03em; color: #fff; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.75rem;">
          <span class="section-3bar" style="width: 22px; height: 22px; gap: 3.5px;"><span></span><span></span><span></span></span>
          TV Shows
        </h1>
        <p style="color: #9CA3AF; font-size: 1rem;">
          Binge full seasons of acclaimed series, gripping crime stories, and weekly episodes.
        </p>
      </div>

      <!-- Filter Pills & Sorting -->
      <div class="filter-bar">
        <div class="filter-pills" role="tablist" aria-label="TV show genre filters">
          <button type="button" class="filter-pill active" data-genre="all">All Series</button>
          <button type="button" class="filter-pill" data-genre="10759">Action & Adventure</button>
          <button type="button" class="filter-pill" data-genre="35">Comedy</button>
          <button type="button" class="filter-pill" data-genre="18">Drama</button>
          <button type="button" class="filter-pill" data-genre="80">Crime</button>
          <button type="button" class="filter-pill" data-genre="10765">Sci-Fi & Fantasy</button>
          <button type="button" class="filter-pill" data-genre="99">Documentary</button>
          <button type="button" class="filter-pill" data-genre="16">Animation</button>
        </div>

        <div class="sort-select-wrapper">
          <label for="tvSortSelect">Sort by:</label>
          <select id="tvSortSelect" class="sort-select" aria-label="Sort TV shows">
            <option value="popularity.desc">Most Popular</option>
            <option value="vote_average.desc">Top Rated</option>
          </select>
        </div>
      </div>

      <!-- TV Shows Grid -->
      <div class="netflix-grid" id="tvGrid">
        <!-- TV Shows dynamically injected -->
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="netflix-footer" id="globalFooter" role="contentinfo"></footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/tmdb-api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
