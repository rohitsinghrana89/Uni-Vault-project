<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — UniVault 4K</title>
  <meta name="description" content="Sign up for UniVault to start streaming movies, TV shows, and anime in 4K Ultra HD.">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="auth-page-wrapper">

    <!-- Backdrop Layer -->
    <div class="auth-backdrop" aria-hidden="true">
      <div class="auth-poster-grid">
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/1E5baAaEse26fej7uHcjOgEE2t2.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/b33nnKl1vBbi4bITVjhne3Nz0h.jpg');"></div>
        <div class="auth-poster-item" style="background-image: url('https://image.tmdb.org/t/p/w500/oBIQDKcqNxKckjug0749V2c1zbt.jpg');"></div>
      </div>
      <div class="auth-overlay-gradient"></div>
    </div>

    <header class="auth-header" role="banner">
      <a href="landing.html" class="auth-brand" aria-label="UniVault Home">
        <img src="images/logo.png" alt="UniVault" class="auth-logo-img">
        <span class="auth-logo-text">UNIVAULT</span>
      </a>
    </header>

    <!-- Main Form Section -->
    <main class="auth-main" role="main">
      <div class="auth-card auth-card-standalone">
        <h1 class="auth-card-title">Create Account</h1>
        <p class="auth-card-subtitle">Join millions streaming movies & shows in 4K Ultra HD</p>

        <div class="auth-error-banner" id="signupErrorBox" role="alert"></div>

        <form class="auth-form" id="signupForm" novalidate>
          <div class="auth-field-group">
            <input 
              type="text" 
              class="auth-input-card" 
              id="signupName" 
              placeholder=" " 
              autocomplete="name" 
              required
            >
            <label for="signupName" class="auth-label-card">Full Name</label>
          </div>

          <div class="auth-field-group">
            <input 
              type="email" 
              class="auth-input-card" 
              id="signupEmail" 
              placeholder=" " 
              autocomplete="email" 
              required
            >
            <label for="signupEmail" class="auth-label-card">Email address</label>
          </div>

          <div class="auth-field-group">
            <input 
              type="password" 
              class="auth-input-card" 
              id="signupPass" 
              placeholder=" " 
              autocomplete="new-password" 
              required
            >
            <label for="signupPass" class="auth-label-card">Password (min 6 characters)</label>
            <button type="button" class="auth-toggle-pass-btn" id="toggleSignupPass" aria-label="Toggle password visibility">👁️</button>
          </div>

          <div class="auth-field-group">
            <input 
              type="password" 
              class="auth-input-card" 
              id="signupConfirmPass" 
              placeholder=" " 
              autocomplete="new-password" 
              required
            >
            <label for="signupConfirmPass" class="auth-label-card">Confirm Password</label>
          </div>

          <button type="submit" class="auth-btn-submit" id="signupSubmitBtn">
            Create Account
          </button>
        </form>

        <div class="auth-card-footer">
          <span class="auth-card-footer-text">Already have an account?</span>
          <a href="login.html" class="auth-card-switch-link">Sign in.</a>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="auth-footer" role="contentinfo">
      <div class="auth-footer-inner">
        <p class="auth-footer-contact">Questions? Call <a href="tel:0008009191694">000-800-919-1694</a></p>
        
        <ul class="auth-footer-links">
          <li><a href="#">FAQ</a></li>
          <li><a href="#">Help Centre</a></li>
          <li><a href="#">Terms of Use</a></li>
          <li><a href="#">Privacy</a></li>
          <li><a href="#">Cookie Preferences</a></li>
        </ul>

        <p class="auth-footer-copyright">UniVault India • 4K Ultra HD Streaming Hub</p>
      </div>
    </footer>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
