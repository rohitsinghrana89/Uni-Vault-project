<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending — UniVault 4K</title>
  <meta name="description" content="Discover what's trending right now across movies and TV series with official 4K trailers.">
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/netflix-theme.css">
  <link rel="stylesheet" href="css/navbar.css">
</head>
<body>

  <!-- Global Navbar -->
  <header class="navbar" id="globalNavbar" role="banner"></header>

  <main class="app-container" style="padding-top: 6rem;" role="main">
    <div class="section-container" style="padding-bottom: 0;">
      <h1 style="font-size: clamp(2rem, 4vw, 3rem); font-weight: 900; letter-spacing: -0.03em; color: #fff; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.75rem;">
        <span class="section-3bar" style="width: 22px; height: 22px; gap: 3.5px;"><span></span><span></span><span></span></span>
        Trending Now
      </h1>
      <p style="color: #9CA3AF; font-size: 1rem;">
        What everyone is watching, talking about, and streaming today on UniVault.
      </p>
    </div>

    <div class="content-wrapper" style="padding-top: 1rem;">
      <section id="carouselTrendingDay" aria-label="Trending Today"></section>
      <section id="carouselTrendingWeek" aria-label="Trending This Week"></section>
      <section id="carouselTrendingMovies" aria-label="Trending Movies"></section>
      <section id="carouselTrendingTV" aria-label="Trending TV Shows"></section>
    </div>
  </main>

  <!-- Global Footer -->
  <footer class="netflix-footer" id="globalFooter" role="contentinfo"></footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/tmdb-api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
