<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — UniVault 4K</title>
  <meta name="description" content="Search movies, TV shows, anime, actors, and directors on UniVault.">
  
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="css/netflix-theme.css">
  <link rel="stylesheet" href="css/navbar.css">
  <style>
    .search-filter-tabs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .search-filter-tab {
      padding: 0.55rem 1.4rem;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .search-filter-tab:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .search-filter-tab.active {
      background: var(--accent-gradient);
      border-color: var(--accent-red);
      color: #fff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
  </style>
</head>
<body>

  <!-- Global Navbar -->
  <header class="navbar" id="globalNavbar" role="banner"></header>

  <main class="app-container" style="padding-top: 7rem;" role="main">
    <div class="section-container">
      
      <!-- Large Search Input -->
      <div style="max-width: 780px; margin: 0 auto 1.75rem; position: relative;">
        <input 
          type="text" 
          id="pageSearchInput" 
          placeholder="Search titles, actors, genres, anime..." 
          aria-label="Search UniVault titles"
          autocomplete="off"
          style="width: 100%; padding: 1.1rem 1.5rem 1.1rem 3.4rem; background: #161622; border: 1px solid rgba(255,255,255,0.18); border-radius: 9999px; color: #fff; font-size: 1.1rem; font-family: inherit; outline: none; box-shadow: 0 8px 30px rgba(0,0,0,0.6); transition: border-color 0.2s ease, box-shadow 0.2s ease;"
        >
        <span style="position: absolute; left: 1.35rem; top: 50%; transform: translateY(-50%); font-size: 1.3rem; color: #9CA3AF;" aria-hidden="true">🔍</span>
      </div>

      <!-- Filter Tabs -->
      <div class="search-filter-tabs" role="tablist" aria-label="Search content categories">
        <button type="button" class="search-filter-tab active" data-type="all">All Titles</button>
        <button type="button" class="search-filter-tab" data-type="movie">Movies</button>
        <button type="button" class="search-filter-tab" data-type="tv">TV Shows</button>
        <button type="button" class="search-filter-tab" data-type="anime">Anime</button>
      </div>

      <!-- Search Status Text -->
      <p id="searchStatusText" style="text-align: center; color: #9CA3AF; font-size: 0.95rem; margin-bottom: 2rem;">
        Explore thousands of movies, TV shows, and anime in 4K
      </p>

      <!-- Search Results Grid -->
      <div class="netflix-grid" id="searchResultsGrid">
        <!-- Results dynamically populated -->
      </div>

    </div>
  </main>

  <!-- Global Footer -->
  <footer class="netflix-footer" id="globalFooter" role="contentinfo"></footer>

  <!-- Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/tmdb-api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
